name: build_bootstrap
inputs:
  targets:
    description: Target patterns to build with the freshly built `buck2`
    default: ":buck2"
runs:
  using: composite
  steps:
  - name: Build with the freshly built `buck2`
    run: |-
      bash .github/scripts/report_failure.sh "buck2 build ${{ inputs.targets }}" \
        "$RUNNER_TEMP/artifacts/buck2" build ${{ inputs.targets }} -v 2
    shell: bash
