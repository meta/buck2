[package]
authors = ["Meta"]
description = "Inspect rust object tree and output it as flamegraph"
documentation = "https://docs.rs/allocative"
edition = "2024"
license = { workspace = true }
name = "allocative"
repository = "https://github.com/facebook/buck2"
version = "0.3.7"

[dependencies]
allocative_derive = { path = "../allocative_derive", version = "=0.3.6" }

ctor = { workspace = true }

anyhow = { version = "1.0.65", optional = true }
bumpalo = { version = "3.11.1", optional = true }
compact_str = { version = "0.9", optional = true }
dashmap = { version = "6.1.0", optional = true }
either = { version = "1.8", optional = true }
futures = { version = "0.3.24", optional = true }
hashbrown = { version = "0.16.1", optional = true }
indexmap = { version = "2.2.6", optional = true }
num-bigint = { version = "0.4.3", optional = true }
once_cell = { version = "1.21.4", optional = true }
parking_lot = { version = "0.11.2", optional = true }
prost-types = { version = "0.14.3", optional = true }
serde_json = { version = "1.0.48", optional = true }
slab = { version = "0.4.12", optional = true }
smallvec = { version = "1.10.0", optional = true }
sorted_vector_map.optional = true
# @oss-disable: sorted_vector_map.path = "../../../common/rust/shed/sorted_vector_map"
sorted_vector_map.git = "https://github.com/facebookexperimental/rust-shed" # @oss-enable
sorted_vector_map.version = "0.2"
tokio = { version = "1.5", optional = true, features = ["sync"] }
triomphe = { version = "0.1.8", optional = true }

[dev-dependencies]
inferno = { version = "0.11.11", default-features = false }

[features]
# Each feature gates an `impl Allocative for <third-party type>` in
# `src/impls/*.rs`. The crate ships with all impls on by default; downstreams
# can opt out via `default-features = false` and re-enable individually.
anyhow = ["dep:anyhow"]
bumpalo = ["dep:bumpalo"]
compact_str = ["dep:compact_str"]
dashmap = ["dep:dashmap"]
default = []
either = ["dep:either"]
futures = ["dep:futures"]
hashbrown = ["dep:hashbrown"]
indexmap = ["dep:indexmap"]
num-bigint = ["dep:num-bigint"]
once_cell = ["dep:once_cell"]
parking_lot = ["dep:parking_lot"]
prost-types = ["dep:prost-types"]
serde_json = ["dep:serde_json"]
slab = ["dep:slab"]
smallvec = ["dep:smallvec"]
sorted_vector_map = ["dep:sorted_vector_map"]
tokio = ["dep:tokio"]
triomphe = ["dep:triomphe"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(rust_nightly)"] }
