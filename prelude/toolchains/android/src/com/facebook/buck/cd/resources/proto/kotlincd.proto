syntax = "proto3";

option java_multiple_files = true;
option java_package = "com.facebook.buck.cd.model.kotlin";
option java_outer_classname = "KotlinCDProto";

// best practices to include version number in package
package kotlincd.api.v1;

import "javacd.proto";
import "common.proto";

message BuildKotlinCommand {
  BuildCommand buildCommand = 1;
  PostBuildParams postBuildParams = 2;
}

message BuildCommand {
  javacd.api.v1.BuildMode buildMode = 1;
  javacd.api.v1.BaseJarCommand baseJarCommand = 2;
  KotlinExtraParams kotlinExtraParams = 3;
}

message KotlinExtraParams {
  repeated string extraClassPaths = 2;
  string standardLibraryClassPath = 3;
  string annotationProcessingClassPath = 4;
  reserved 5;
  repeated string extraKotlincArguments = 6;
  // kotlinCompilerPlugin keys are strings encoded as strings due to limitations
  // in proto3.
  map<string, PluginParams> kotlinCompilerPlugins = 7;
  map<string, string> kosabiPluginOptions = 8;
  reserved 9;
  reserved "kosabiJvmAbiGenEarlyTerminationMessagePrefix";
  repeated string friendPaths = 10;
  repeated string kotlinHomeLibraries = 11;
  string jvmTarget = 12;
  reserved 13;
  bool shouldUseJvmAbiGen = 14;
  string jvmAbiGenPlugin = 15;
  bool shouldVerifySourceOnlyAbiConstraints = 16;
  bool shouldRemoveKotlinCompilerFromClassPath = 17;
  string depTrackerPlugin = 18;
  bool shouldKotlincRunIncrementally = 21;
  string incrementalStateDir = 22;
  string languageVersion = 23;
  repeated string extraClassPathSnapshots = 24;
  reserved 26; // was shouldKsp2RunIncrementally, KSP2 always runs
               // non-incrementally
  reserved "shouldKsp2RunIncrementally";
  reserved 27; // was shouldKosabiJvmAbiGenUseK2, unused (kotlincd derives K2
               // from LanguageVersion.getSupportsK2())
  reserved 28;
  reserved "kotlinClassesDir";
  reserved 29; // was skipClasspathRemovalRebuild, removed after KT-85740 fix
  string javaBinary = 30;
  // Reduced SO-ABI classpath for the applicability plugin (only deps with
  // required_for_source_only_abi=True or in source_only_abi_deps). Distinct
  // from compileTimeClasspathPaths which contains the full dep set during
  // library builds.
  repeated string applicabilityClasspath = 31;
  // Records only directly-referenced classes in Kosabi source-only ABI dep
  // files, recursing into supertypes for the target's own supertype chain.
  bool shouldKosabiUseShallowClassUsage = 32;
  // How the K2 JVM ABI gen plugin reports ABI content repaired because a
  // dependency was missing from the source-only ABI classpath: off, warn,
  // or error (fails the compilation instead of emitting a knowingly-wrong ABI).
  string kosabiAbiValidationMode = 33;
  // `option=value` pairs passed to the K2 JVM ABI gen plugin of source-only ABI
  // actions, set by toolchain kill switches. Empty by default.
  repeated string kosabiJvmAbiGenOptions = 40;
}

message PluginParams {
  map<string, string> params = 1;
}

/** Model for metadata provided by Buck2 incremental action see:
 * https://buck2.build/docs/rule_authors/incremental_actions */
message ActionMetadata {
  Metadata previousMetadata = 1;
  Metadata currentMetadata = 2;
}

message Metadata {
  repeated Digests digests = 1;
}

message Digests {
  string path = 1;
  string digest = 2;
}
